<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05060f}</style></head>
<body><canvas id="c" width="1200" height="630"></canvas>
<script>
// The link-preview image (og.png, 1200x630): the name, the promise, and a real battle from the game (battle.png).
var c = document.getElementById('c'), x = c.getContext('2d');
var g = x.createLinearGradient(0, 0, 0, 630); g.addColorStop(0, '#05060f'); g.addColorStop(1, '#1a0b33');
x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
x.strokeStyle = 'rgba(177,77,255,0.18)';
for (var i = 0; i <= 1200; i += 60) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 630); x.stroke(); }
for (i = 0; i <= 630; i += 60) { x.beginPath(); x.moveTo(0, i); x.lineTo(1200, i); x.stroke(); }
function txt(t, yy, size, color) { x.save(); x.font = 'bold ' + size + 'px Arial, sans-serif'; x.shadowColor = color; x.shadowBlur = 18; x.fillStyle = color; x.fillText(t, 60, yy); x.restore(); }
txt('NEON', 190, 110, '#ff00c8'); txt('COMMAND', 300, 110, '#00f0ff');
txt('Estrategia contra mi bot,', 400, 40, '#ffffff'); txt('un mapa nuevo cada día.', 452, 40, '#ffffff');
txt('¿Le ganas?', 545, 38, '#ffdc3c');
var img = new Image();
img.onload = function () {
  // the battlefield only (no HUD, no command bar), framed with a neon border
  var sx = 0, sy = 88, sw = 800, sh = 900, dh = 520, dw = dh * sw / sh, dx = 1200 - dw - 50, dy = 55;
  x.save(); x.shadowColor = '#00f0ff'; x.shadowBlur = 20; x.strokeStyle = '#00f0ff'; x.lineWidth = 4; x.strokeRect(dx - 3, dy - 3, dw + 6, dh + 6); x.restore();
  x.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
};
img.src = '../tests/out-battle.png';
</script></body></html>
